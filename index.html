<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Picardy — chord progressions, explained</title>
    <meta
      name="description"
      content="Enter chords and get ranked suggestions for what comes next, each with a roman numeral, a reason, and a live view on guitar and piano."
    />

    <!-- The mark: a P that is an upside-down half note. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <!-- Matches the panel colour so mobile browser chrome blends into the app. -->
    <meta name="theme-color" content="#1c1812" />

    <meta property="og:title" content="Picardy — chord progressions, explained" />
    <meta
      property="og:description"
      content="Ranked next-chord suggestions with the theory spelled out, on a fretboard and a keyboard."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://picardy.xyz/" />
    <!--
      1200×630, the shape every scraper crops to — and an absolute URL, because
      a root-relative one is only resolved by some of them. The rest silently
      show no image, which you cannot see from the page itself.
    -->
    <meta property="og:image" content="https://picardy.xyz/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
